<style>
:root{--verde:#85B941;--vosc:#1F4D2B;--crema:#F4EEE2;--tinta:#23302A;--gris:#5F6B64}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Nunito Sans",-apple-system,system-ui,sans-serif;color:var(--tinta);background:#fff}
header{background:var(--vosc);color:#fff;padding:22px 16px 26px;text-align:center}
header img{width:190px;max-width:60%;filter:brightness(0) invert(1)}
header h1{font-size:1.32rem;font-weight:800;margin-top:14px;line-height:1.2}
header p{font-size:.92rem;color:#CFE0C4;margin-top:6px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:6px}
.foto{border:0;padding:0;background:var(--crema);cursor:pointer;aspect-ratio:1;overflow:hidden;display:block}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
footer{background:var(--crema);padding:26px 18px 34px;text-align:center}
footer h2{color:var(--vosc);font-size:1.1rem}
footer p{font-size:.92rem;color:var(--gris);margin-top:6px}
.wa{display:inline-block;margin-top:14px;background:var(--verde);color:#fff;text-decoration:none;font-weight:800;padding:13px 26px;border-radius:999px;font-size:1rem}
.web{display:block;margin-top:12px;color:var(--vosc);font-weight:600;text-decoration:none;font-size:.92rem}
.chico{font-size:.74rem;color:var(--gris);margin-top:18px}
#visor{position:fixed;inset:0;background:rgba(15,25,18,.96);display:none;align-items:center;justify-content:center;z-index:9}
#visor.abierto{display:flex}
#visor img{max-width:96vw;max-height:84vh;object-fit:contain}
#visor .cerrar{position:absolute;top:10px;right:14px;color:#fff;background:none;border:0;font-size:2.1rem;line-height:1;cursor:pointer}
#visor .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);color:#fff;border:0;font-size:1.7rem;padding:14px 16px;cursor:pointer;border-radius:8px}
#visor .ant{left:8px} #visor .sig{right:8px}
#visor .cuenta{position:absolute;bottom:16px;color:#CFE0C4;font-size:.85rem;width:100%;text-align:center}
@media(min-width:700px){header h1{font-size:1.7rem} .galeria{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:8px;max-width:1200px;margin:0 auto}}

<script>
const FOTOS = [{"n": "01"}, {"n": "02"}, {"n": "03"}, {"n": "04"}, {"n": "05"}, {"n": "06"}, {"n": "07"}, {"n": "08"}, {"n": "09"}, {"n": "10"}, {"n": "11"}, {"n": "12"}, {"n": "13"}, {"n": "14"}, {"n": "15"}, {"n": "16"}, {"n": "17"}, {"n": "18"}, {"n": "19"}, {"n": "20"}, {"n": "21"}, {"n": "22"}, {"n": "23"}, {"n": "24"}, {"n": "25"}, {"n": "26"}, {"n": "27"}, {"n": "28"}, {"n": "29"}, {"n": "30"}, {"n": "31"}, {"n": "32"}, {"n": "33"}, {"n": "34"}, {"n": "35"}, {"n": "36"}, {"n": "37"}, {"n": "38"}];
const visor = document.getElementById('visor'), grande = document.getElementById('grande'),
      cuenta = visor.querySelector('.cuenta');
let i = 0;
function ver(n){
  i = (n + FOTOS.length) % FOTOS.length;
  grande.src = 'img/' + FOTOS[i].n + '.jpg';
  cuenta.textContent = (i + 1) + ' de ' + FOTOS.length;
  visor.classList.add('abierto');
  document.body.style.overflow = 'hidden';
}
function cerrar(){ visor.classList.remove('abierto'); document.body.style.overflow = ''; }
document.querySelectorAll('.foto').forEach(b => b.onclick = () => ver(+b.dataset.i));
visor.querySelector('.cerrar').onclick = cerrar;
visor.querySelector('.ant').onclick = e => { e.stopPropagation(); ver(i - 1); };
visor.querySelector('.sig').onclick = e => { e.stopPropagation(); ver(i + 1); };
visor.onclick = e => { if (e.target === visor || e.target === grande) cerrar(); };
document.onkeydown = e => {
  if (!visor.classList.contains('abierto')) return;
  if (e.key === 'Escape') cerrar();
  if (e.key === 'ArrowRight') ver(i + 1);
  if (e.key === 'ArrowLeft') ver(i - 1);
};
let x0 = null;
visor.addEventListener('touchstart', e => x0 = e.changedTouches[0].clientX, {passive:true});
visor.addEventListener('touchend', e => {
  if (x0 === null) return;
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 45) ver(i + (d < 0 ? 1 : -1));
  x0 = null;
}, {passive:true});
</script>
